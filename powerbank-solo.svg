<svg xmlns="http://www.w3.org/2000/svg" viewBox="384 24 358 700" role="img" aria-label="Compacte ChargeLoop-powerbank met drie ingebouwde kabels">
<defs>
<filter id="sh" x="-35%" y="-20%" width="170%" height="150%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#022943" flood-opacity=".2"/></filter>
<linearGradient id="pb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b2c3a"/><stop offset="1" stop-color="#0a141c"/></linearGradient>
<linearGradient id="mt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9aa3ad"/><stop offset=".5" stop-color="#e9edf1"/><stop offset="1" stop-color="#9aa3ad"/></linearGradient>
<linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2f36"/><stop offset="1" stop-color="#050607"/></linearGradient>
</defs>
<!-- powerbank -->
<g>
<rect x="404" y="40" width="318" height="690" rx="44" fill="url(#pb)"/>
<rect x="404" y="40" width="318" height="690" rx="44" fill="none" stroke="#2f4254" stroke-width="2"/>
<!-- logo -->
<g transform="translate(563 218)">
<circle r="46" fill="none" stroke="#fff" stroke-width="12" stroke-dasharray="230 70" transform="rotate(35)"/>
<rect x="-17" y="-20" width="10" height="40" rx="3" fill="#FE6615"/><rect x="-3" y="-20" width="10" height="40" rx="3" fill="#FE6615"/><rect x="11" y="-20" width="10" height="40" rx="3" fill="#FE6615"/>
</g>
<text x="563" y="330" text-anchor="middle" font-family="Montserrat,Helvetica,Arial,sans-serif" font-weight="600" font-size="44" fill="#fff">Charge<tspan fill="#FE6615">Loop</tspan></text>
<text x="563" y="402" text-anchor="middle" font-family="Montserrat,Helvetica,Arial,sans-serif" font-weight="700" font-size="17" letter-spacing="2.2" fill="#c8d5e0">COMPACT &amp; SNEL</text>
<text x="563" y="426" text-anchor="middle" font-family="Montserrat,Helvetica,Arial,sans-serif" font-weight="700" font-size="17" letter-spacing="2.2" fill="#c8d5e0">POWERBANK</text>
<!-- kabelvak -->
<path d="M452 520 h222 a18 18 0 0 1 18 18 v140 a18 18 0 0 1 -18 18 h-222 a18 18 0 0 1 -18 -18 v-140 a18 18 0 0 1 18 -18z" fill="#060c11"/>
<!-- kabels -->
<g fill="#10171d"><rect x="474" y="600" width="34" height="100" rx="8"/><rect x="544" y="600" width="34" height="100" rx="8"/><rect x="614" y="600" width="34" height="100" rx="8"/></g>
<!-- micro usb -->
<g transform="translate(491 560)"><rect x="-26" y="-12" width="52" height="64" rx="14" fill="#10171d"/><path d="M-20 -46 h40 l4 10 v22 h-48 v-22z" fill="url(#mt)"/><rect x="-12" y="-40" width="24" height="8" rx="3" fill="#6b7580"/></g>
<!-- usb-c -->
<g transform="translate(561 560)"><rect x="-26" y="-12" width="52" height="64" rx="14" fill="#10171d"/><rect x="-24" y="-50" width="48" height="40" rx="19" fill="url(#mt)"/><rect x="-14" y="-40" width="28" height="20" rx="9" fill="#2a3138"/></g>
<!-- lightning -->
<g transform="translate(631 560)"><rect x="-26" y="-12" width="52" height="64" rx="14" fill="#10171d"/><rect x="-22" y="-52" width="44" height="42" rx="9" fill="url(#mt)"/><g fill="#c9a24a"><rect x="-14" y="-47" width="4" height="12"/><rect x="-7" y="-47" width="4" height="12"/><rect x="0" y="-47" width="4" height="12"/><rect x="7" y="-47" width="4" height="12"/></g></g>
<g fill="#4a5967"><path d="M474 694 l16 10 l16 -10 z" opacity=".0"/></g>
</g>
