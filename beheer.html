 body.innerHTML='<h2 style="font-size:2rem;margin-bottom:6px">Locaties</h2><p class="note">Zonder vinkje is een station actief en staat het gewoon in de lijst. Met het vinkje komt er een label Binnenkort bij. Het aantal stations op de homepage wordt hieruit berekend. Klik op de kaart om de positie van een nieuw station te kiezen.</p><div class="cmap" id="amap" style="height:340px;margin-bottom:12px"></div><p class="note" id="clickp">Klik op de kaart om de coördinaten over te nemen: <b id="pos">–</b></p><div class="acts" style="margin-bottom:16px"><button type="button" id="add">+ Nieuw station</button>'+(off?'<button type="button" id="demoback">Voorbeeldlocaties terugzetten</button>':'')+'<span id="addmsg" style="align-self:center;font-weight:700"></span></div><div id="items">'+items.map(row).join('')+'</div>';

 $('#add').onclick=function(){var sp=$('#addmsg');sp.textContent='Bezig met toevoegen...';sp.style.color='#1B7F3B';Promise.race([db.collection('stations').add({naam:'Nieuw station',plaats:'',adres:'',lat:51.5,lng:3.8,status:'soon',slots:6}),new Promise(function(_,r){setTimeout(function(){r({code:'timeout',message:'geen reactie van de database'})},12000)})]).then(function(){sp.textContent='Station toegevoegd.';toast('Station toegevoegd.');setTimeout(vStations,800)},function(e){LE(e);sp.textContent='Toevoegen lukt niet: '+(e.code||'')+' '+(e.message||e);sp.style.color='#C0392B'})};
 var dbk=$('#demoback');if(dbk)dbk.onclick=function(){db.doc('settings/demo_off').set({off:false}).then(function(){vStations()},function(e){LE(e);toast('Terugzetten lukt niet.',1)})};
 [].forEach.call(document.querySelectorAll('#items .it'),function(it){

  function say(t,bad){msg.textContent=t;msg.style.color=bad?'#C0392B':'#1B7F3B';try{msg.scrollIntoView({block:'center',behavior:'smooth'})}catch(e){}}
  function W(p){return Promise.race([p,new Promise(function(_,rej){setTimeout(function(){rej({code:'timeout',message:'geen reactie van de database na 12 seconden'})},12000)})])}
  it.querySelector('.sv').onclick=function(){var d=get();if(isNaN(d.lat)||isNaN(d.lng)){say('Vul geldige coördinaten in.',1);return}
   say('Bezig met opslaan...');
   W(db.doc('stations/'+id).set(d)).then(function(){return W(db.doc('stations/'+id).get())}).then(function(r){
     var ok=r&&r.exists!==false&&r.data&&r.data().naam===d.naam;
     if(!ok)throw {code:'controle',message:'opgeslagen maar niet teruggevonden'};
     say('Opgeslagen en gecontroleerd.');toast('Opgeslagen.');setTimeout(vStations,1200)},function(e){LE(e);say('Opslaan lukt niet: '+(e.code||'')+' '+(e.message||e),1);toast('Opslaan lukt niet.',1)}).catch(function(e){LE(e);say('Fout: '+(e.code||'')+' '+(e.message||e),1)})};
  it.querySelector('.del').onclick=function(){
   var btn=it.querySelector('.del');
   if(demo){it.remove();if(!document.querySelector('#items .it[data-demo]'))W(db.doc('settings/demo_off').set({off:true})).then(function(){toast('Voorbeeldlocaties verborgen.')},function(e){LE(e);toast('Opslaan lukt niet.',1)});return}
   btn.textContent='Zeker? Klik nogmaals';say('Klik nogmaals op Verwijderen om dit station definitief te verwijderen.',1);
   btn.onclick=function(){say('Bezig met verwijderen...');try{
    W(db.doc('stations/'+id).delete()).then(function(){say('Verwijderd.');toast('Verwijderd.');it.style.opacity='.4';setTimeout(vStations,1000)},function(e){LE(e);say('Verwijderen lukt niet: '+(e.code||'')+' '+(e.message||e),1)})}catch(x){say('Fout bij verwijderen: '+x,1)}}};
  it.querySelector('.geo').onclick=function(){var d2=get();fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent((d2.adres+' '+d2.plaats).trim())).then(function(r){return r.json()}).then(function(j){if(!j.length)throw 0;it.querySelector('[data-k=lat]').value=(+j[0].lat).toFixed(5);it.querySelector('[data-k=lng]').value=(+j[0].lon).toFixed(5);toast('Positie gevonden. Klik op Opslaan.')}).catch(function(){toast('Niet gevonden. Klik op de kaart en kopieer de coördinaten.',1)})};
 });

 }catch(e){LE(e);toast('Locaties laden lukt niet.',1)}}

var SLOTS=[['step1','Homepage stap 1 (Tap)'],['step2','Homepage stap 2 (Charge)'],['step3','Homepage stap 3 (Go)'],['logo','Logo in de menubalk (bovenaan)'],['logo_footer','Logo in de footer (wit logo, bij voorkeur PNG met transparante achtergrond)'],['hero','Homepage: hero (bovenaan)'],['station','Homepage: uitleg station'],['cables','Homepage: bij kabels'],['business','Homepage: ChargeLoop in je zaak'],['festival','Evenementen: foto van stations op een festival'],['biz_what','Voor bedrijven: foto bij Wat is een ChargeLoop-station'],['fest_what','Evenementen: foto bij Wat is een ChargeLoop-station'],['st6','Voor bedrijven: station 6 slots'],['st12','Voor bedrijven: station 12 slots'],['st24','Voor bedrijven: station 24 slots'],['st48','Voor bedrijven: station 48 slots']];
function shrink(file,png){return new Promise(function(res,rej){var r=new FileReader();r.onerror=rej;r.onload=function(){var im=new Image();im.onerror=rej;im.onload=function(){var m=1400,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);var x=c.getContext('2d');if(!png){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0,c.width,c.height);res(png?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.8))};im.src=r.result};r.readAsDataURL(file)})}
async function vImages(){
 var s=await db.collection('settings').get(),cur={};s.docs.forEach(function(d){if(d.id.indexOf('img_')===0)cur[d.id.slice(4)]=d.data().src});
 body.innerHTML='<h2 style="font-size:2rem;margin-bottom:6px">Foto\'s</h2><p class="note">Kies per plek een foto. Zonder eigen foto toont de site de standaardafbeelding. Foto\'s worden automatisch verkleind.</p>'+SLOTS.map(function(x){return '<div class="it" data-k="'+x[0]+'"><b>'+x[1]+'</b>'+(cur[x[0]]?'<img src="'+cur[x[0]]+'" alt="" style="max-height:140px;width:auto;border-radius:12px;justify-self:start;'+(x[0]==='logo_footer'?'background:#022943;padding:12px':'')+'">':'<span style="color:var(--muted);font-size:14px">Standaardafbeelding</span>')+'<div class="acts"><label class="btn btn-navy" style="padding:9px 18px;font-size:14px;cursor:pointer">Foto kiezen<input type="file" accept="image/*" hidden></label>'+(cur[x[0]]?'<button class="del">Terug naar standaard</button>':'')+'</div></div>'}).join('');
 body._h&&body.removeEventListener('click',body._h);function h(e){var b=e.target.closest('button.del');var it=e.target.closest('.it[data-k]');if(b&&it&&tab==='images')db.doc('settings/img_'+it.dataset.k).delete().then(vImages)}body.addEventListener('click',h);body._h=h;
 body.querySelectorAll('input[type=file]').forEach(function(f){f.addEventListener('change',async function(){var it=f.closest('.it');if(!f.files[0])return;try{var isLogo=it.dataset.k.indexOf('logo')===0;var d=await shrink(f.files[0],isLogo&&/png|svg|webp/.test(f.files[0].type));await db.doc('settings/img_'+it.dataset.k).set({src:d});toast('Foto opgeslagen.');vImages()}catch(e){LE(e);toast('Opslaan lukt niet. Probeer een kleinere foto.',1)}})})}

async function vVert(){
 var NL=window.CL_NL||{},base=window.CL_EN||{},ids=Object.keys(NL),cur=Object.assign({},base);

async function vLeads(){
